<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // In-app browsers (Instagram, KakaoTalk, Facebook, ...) sandbox mailto:
      // links so "Send Message" / "Send Print Request" silently fail. Detect
      // them on first load and try to bounce out to the real browser once.
      (function () {
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";
        var isInApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\//i.test(ua);
        if (!isInApp) return;

        var currentUrl = window.location.href;
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);

        if (isAndroid) {
          var withoutScheme = currentUrl.replace(/^https?:\/\//, "");
          window.location.href =
            "intent://" +
            withoutScheme +
            "#Intent;scheme=https;package=com.android.chrome;end;";
        } else if (isIOS) {
          // iOS in-app browsers frequently block this scheme, so it isn't
          // guaranteed to work, but it's worth the one attempt.
          window.location.href = "x-safari-" + currentUrl;
        }
      })();
    </script>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Ningen Paper Press"
    />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Ningen Paper Press</title>
  </head>

</html>

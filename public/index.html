<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // In-app browsers (Instagram, KakaoTalk, Facebook, ...) sandbox mailto:
      // links so "Send Message" / "Send Print Request" silently fail.
      (function () {
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";
        var isInApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\//i.test(ua);
        if (!isInApp) return;

        var currentUrl = window.location.href;
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);

        // An automatic redirect on page load has no user gesture behind it,
        // and most in-app browsers block exactly that (it's how they stop
        // sites from escaping without the person asking). A tap on a real
        // button is a genuine gesture, so the escape link only goes on the
        // banner's button below instead of firing here automatically.
        var escapeHref = currentUrl;
        if (isAndroid) {
          var withoutScheme = currentUrl.replace(/^https?:\/\//, "");
          escapeHref =
            "intent://" +
            withoutScheme +
            "#Intent;scheme=https;package=com.android.chrome;end;";
        }

        document.addEventListener("DOMContentLoaded", function () {
          var bar = document.createElement("div");
          bar.setAttribute(
            "style",
            "position:fixed;top:0;left:0;right:0;z-index:999999;" +
              "background:#000;color:#fff;font-family:'fifteen',monospace;font-size:13px;" +
              "line-height:1.4;padding:10px 14px;display:flex;align-items:center;" +
              "justify-content:space-between;gap:10px;",
          );

          // iOS in-app browsers (Instagram, KakaoTalk, ...) block every
          // known JS/HTML escape outright, by design, even from a real tap.
          // The only thing that actually works there is the app's own menu,
          // so point people at it instead of a dead button.
          if (isIOS) {
            bar.innerHTML =
              "<span>Open this page in Safari to send email.</span>";
          } else {
            bar.innerHTML =
              "<span>Emailing doesn't work in this in-app browser.</span>" +
              '<a href="' +
              escapeHref +
              '" style="flex-shrink:0;background:#fff;color:#000;padding:6px 10px;' +
              'text-decoration:none;white-space:nowrap;">Open in browser</a>';
          }

          document.body.prepend(bar);
          document.body.style.paddingTop = bar.offsetHeight + "px";
        });
      })();
    </script>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Ningen Paper Press"
    />

      manifest.json provides metadata used when your web app is installed on a

    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Ningen Paper Press</title>
  </head>

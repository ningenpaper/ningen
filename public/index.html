<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // In-app browsers (Instagram, KakaoTalk, Facebook, ...) sandbox mailto:
      // links so "Send Message" / "Send Print Request" silently fail.
      (function () {
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";
        var isInApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\//i.test(ua);
        if (!isInApp) return;

        var currentUrl = window.location.href;
        var isAndroid = /Android/i.test(ua);

        // Android: this usually works and takes over navigation immediately,
        // so the fallback banner below is rarely even seen.
        if (isAndroid) {
          var withoutScheme = currentUrl.replace(/^https?:\/\//, "");
          window.location.href =
            "intent://" +
            withoutScheme +
            "#Intent;scheme=https;package=com.android.chrome;end;";
        }
        // iOS in-app browsers block every known JS-only escape scheme, and
        // forcing one leaves a blank white page instead of failing quietly.
        // Skip the automatic attempt there and always show a manual button.

        document.addEventListener("DOMContentLoaded", function () {
          var bar = document.createElement("div");
          bar.setAttribute(
            "style",
            "position:fixed;top:0;left:0;right:0;z-index:999999;" +
              "background:#000;color:#fff;font-family:sans-serif;font-size:13px;" +
              "line-height:1.4;padding:10px 14px;display:flex;align-items:center;" +
              "justify-content:space-between;gap:10px;",
          );
          bar.innerHTML =
            "<span>인앱 브라우저에서는 메일 전송이 제한됩니다.</span>" +
            '<a href="' +
            currentUrl +
            '" target="_blank" rel="noopener noreferrer" style="flex-shrink:0;' +
            "background:#fff;color:#000;padding:6px 10px;text-decoration:none;" +
            'white-space:nowrap;">브라우저에서 열기</a>';
          document.body.prepend(bar);
          document.body.style.paddingTop = bar.offsetHeight + "px";
        });
      })();
    </script>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Ningen Paper Press"
    />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Ningen Paper Press</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
